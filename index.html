<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reilly & Jacob | April 25, 2026</title>
    <meta name="description" content="Join us for our wedding celebration at Bengal Bay, Jamaica on April 25, 2026">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Wooden Frame -->
    <div class="frame-top"></div>
    <div class="frame-bottom"></div>
    <div class="frame-left"></div>
    <div class="frame-right"></div>
    
    <!-- Navigation -->
    <nav class="nav-pinned">
        <a href="#details" class="nav-tab">Details</a>
        <a href="#travel" class="nav-tab">Travel</a>
        <a href="#rsvp" class="nav-tab">RSVP</a>
        <a href="#registry" class="nav-tab">Registry</a>
    </nav>

    <!-- Main Container -->
    <main class="corkboard-container">
        <!-- Top Row: Left Column, Save the Date, Right Column -->
        <div class="photos-left">
            <div class="card polaroid size-medium" data-rotation="3">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr1.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-small" data-rotation="-2">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr2.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>
        </div>

        <!-- Save the Date Card - Primary Focus -->
        <div class="card save-the-date" data-rotation="-1">
            <div class="pushpin"></div>
            <img src="assets/images/save-the-date-bw.png" alt="Save the Date - Reilly & Jacob - April 25, 2026 - Bengal Bay, Jamaica" class="save-the-date-image">
        </div>

        <div class="photos-right">
            <div class="card polaroid size-large" data-rotation="4">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr3.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-medium" data-rotation="-3">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr4.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>
        </div>

        <!-- Bottom Photos - Remaining Images -->
        <div class="photos-bottom">
            <div class="card polaroid size-small" data-rotation="2">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr5.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-large" data-rotation="-4">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr6.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-medium" data-rotation="1">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr7.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-small" data-rotation="-1">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr8.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-large" data-rotation="3">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr9.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-medium" data-rotation="-2">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr10.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-small" data-rotation="4">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr11.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-large" data-rotation="-3">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr12.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-medium" data-rotation="2">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr13.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-small" data-rotation="-4">
                <div class="pushpin pushpin-brass"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr14.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>

            <div class="card polaroid size-large" data-rotation="1">
                <div class="pushpin pushpin-red"></div>
                <div class="polaroid-frame">
                    <img src="assets/images/jr15.jpeg" alt="Memory" class="polaroid-photo">
                </div>
            </div>
        </div>
    </main>

    <!-- Sections (Hidden initially, can be revealed via navigation) -->
    <section id="details" class="detail-section">
        <div class="section-content">
            <h2>Wedding Details</h2>
            <p>More information coming soon...</p>
        </div>
    </section>

    <section id="travel" class="detail-section">
        <div class="section-content">
            <h2>Travel & Accommodations</h2>
            <p>More information coming soon...</p>
        </div>
    </section>

    <section id="rsvp" class="detail-section">
        <div class="section-content">
            <h2>RSVP</h2>
            <p>More information coming soon...</p>
        </div>
    </section>

    <section id="registry" class="detail-section">
        <div class="section-content">
            <h2>Registry</h2>
            <p>More information coming soon...</p>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">&times;</button>
        <button class="lightbox-prev">&#8249;</button>
        <button class="lightbox-next">&#8250;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full size image">
        </div>
    </div>

    <!-- Desktop Image Overlay -->
    <div id="image-overlay" class="image-overlay" style="display: none;">
        <button class="image-overlay-close">&times;</button>
        <img id="overlay-img" src="" alt="">
    </div>

    <script src="script.js"></script>
</body>
</html>
